name: E2E Visual Baseline

# Genera o actualiza los baselines de imagenes para los tests visuales.
# Pensado para correr enteramente en GitHub Actions — NO requiere ejecucion
# local. Los PNGs tienen que salir del runner: el renderizado de fuentes de
# una maquina local no coincide y el job `visual` fallaria siempre.
#
# Al terminar deja los baselines en una rama y el enlace para abrir el PR en
# el resumen del run.
#
# Cuando usar:
#   - Primera vez (bootstrap): no hay baselines en la rama. Dispara este
#     workflow para crearlos.
#   - Despues de reestructurar UI: el job "visual" en e2e.yml fallara
#     porque las imagenes cambiaron. Dispara este workflow para refrescar
#     los baselines y aprueba el PR resultante.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama base donde generar/actualizar baselines (default: main)'
        required: false
        default: 'main'

  # Empujar cualquier commit a esta rama equivale a lanzarlo a mano. Existe
  # porque workflow_dispatch no está al alcance de todos los actores —un token
  # de GitHub App sin permiso sobre Actions recibe 403— y sin baselines el job
  # `visual` de e2e.yml se salta para siempre, que es lo que llevaba pasando.
  push:
    branches: ['ci/generar-baselines-visuales']

# Ya no abre PRs: solo empuja la rama con los PNG.
permissions:
  contents: write

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gastos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gastos_e2e
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: e2e-anon-key
      SUPABASE_SERVICE_ROLE_KEY: e2e-service-key
      GEMINI_API_KEY: ''
      DEV_AUTH_BYPASS: '1'
      DEV_AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN || 'dev-token-e2e-DO-NOT-USE-IN-PROD' }}
      E2E_USER_ID: 00000000-0000-0000-0000-000000000101
      E2E_USER_EMAIL: demo1@test.local
      NODE_ENV: development
      NUXT_PORT: '3000'
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply DB schema
        run: npm run db:apply

      - name: Seed temporary users
        run: npm run db:seed:temp-users

      - name: Seed datos realistas
        run: npm run db:seed:test 00000000-0000-0000-0000-000000000101
        continue-on-error: true

      - name: Start dev server
        run: |
          npm run dev > nuxt-dev.log 2>&1 &
          echo $! > .nuxt-dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 2
          done

      - name: Generate / update visual snapshots
        run: npx playwright test --project=visual --update-snapshots
        env:
          CI: 'true'

      - name: Stop dev server
        if: always()
        run: |
          if [ -f .nuxt-dev.pid ]; then
            kill $(cat .nuxt-dev.pid) || true
          fi

      - name: Detectar cambios en snapshots
        id: changes
        run: |
          git add -A e2e/visual
          if git diff --cached --quiet; then
            echo "any=false" >> $GITHUB_OUTPUT
            echo "No hay cambios en snapshots — los baselines actuales coinciden con la UI."
          else
            echo "any=true" >> $GITHUB_OUTPUT
            git diff --cached --stat e2e/visual
          fi

      # Publica la rama y deja que el PR lo abra una persona (o el agente que
      # lanzó el workflow). Antes esto usaba peter-evans/create-pull-request y
      # fallaba: crear PRs desde Actions depende de un permiso del repositorio
      # —Settings → Actions → "Allow GitHub Actions to create and approve pull
      # requests"— que no está activado. Empujar una rama solo necesita
      # `contents: write`, que ya está concedido arriba, así que el trabajo
      # caro (generar los PNG en el runner) no se tira a la basura por un
      # permiso que falta.
      - name: Publicar baselines en una rama
        if: steps.changes.outputs.any == 'true'
        env:
          RAMA: chore/visual-baselines-${{ github.run_id }}
          BASE: ${{ inputs.branch || 'main' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$RAMA"
          git add -A e2e/visual
          git commit -m 'chore(e2e): actualizar baselines visuales'
          git push origin "$RAMA"

          {
            echo "## Baselines generados"
            echo ""
            echo "Rama: \`$RAMA\`"
            echo ""
            echo "Abre el PR contra \`$BASE\` y revisa cada PNG en la pestaña"
            echo "**Files changed** — GitHub muestra la comparativa lado a lado."
            echo "Tras mergearlo, el job \`visual\` de \`e2e.yml\` empieza a comparar"
            echo "contra estos baselines en vez de saltarse."
            echo ""
            echo "[Abrir el PR](${{ github.server_url }}/${{ github.repository }}/compare/$BASE...$RAMA?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nada que actualizar
        if: steps.changes.outputs.any != 'true'
        run: |
          {
            echo "## Sin cambios"
            echo ""
            echo "Los baselines actuales ya coinciden con la UI."
          } >> "$GITHUB_STEP_SUMMARY"
