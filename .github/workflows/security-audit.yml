# Auditoría semanal de dependencias, independiente de pushes: el job
# `audit` de ci.yml solo corre cuando hay actividad, y un repo personal
# puede pasar semanas quieto mientras se publican CVEs.
name: Security Audit

on:
  schedule:
    - cron: '30 9 * * 1' # lunes 09:30 UTC = 04:30 América/Lima
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Sin install: npm audit lee package-lock directamente vía registry.
      #
      # Umbral `high`: queda fuera a propósito una moderada conocida —
      # uuid <11.1.1 (GHSA-w5hq-g745-h8pq, bounds check ausente en v3/v5/v6)
      # que entra vía exceljs. Su único "arreglo" es bajar exceljs a 3.4.0,
      # un downgrade mayor que rompería el export a Excel, y la ruta
      # vulnerable (uuid con buffer explícito) no se usa en el proyecto.
      # Revisar si exceljs publica una versión con uuid >=11.1.1.
      - name: npm audit (high+, prod deps)
        run: npm audit --audit-level=high --omit=dev
